<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELINA | PORTFOLIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Montserrat:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --bg-dark: #050505;
            --card-glass: rgba(255, 255, 255, 0.05);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-dark); 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- COOL BACKGROUND --- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* --- TOP LEFT LOGO --- */
        .logo {
            position: fixed;
            top: 30px;
            left: 40px;
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
            z-index: 1000;
            text-shadow: 0 0 15px var(--accent);
        }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .load-text {
            font-family: 'Syncopate';
            font-size: 2rem;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* --- MAIN PAGE (BIGGY BIG BIG) --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
        }

        .hero h1 {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 0.8;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 30px rgba(0, 242, 255, 0.3));
        }

        .hero p {
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #888;
            text-transform: uppercase;
        }

        /* --- CATEGORY TABS --- */
        .tab-container {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            padding: 20px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 900;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .tab-btn {
            padding: 12px 30px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            cursor: pointer;
            font-family: 'Syncopate';
            font-size: 0.8rem;
            transition: var(--transition);
            border-radius: 4px;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--accent);
            color: black;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent);
        }

        /* --- CONTENT SECTIONS --- */
        section {
            padding: 100px 5%;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 3rem;
            margin-bottom: 50px;
            border-left: 8px solid var(--accent);
            padding-left: 20px;
        }

        /* --- SQUARE VIDEO GRID --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
        }

        .square-card {
            position: relative;
            aspect-ratio: 1 / 1; /* FORCED SQUARE */
            background: var(--card-glass);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
        }

        .square-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.8s;
            filter: grayscale(80%);
        }

        .square-card:hover .thumb-img {
            filter: grayscale(0%) scale(1.1);
            opacity: 0.4;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            opacity: 0;
            transition: 0.3s;
        }
        .square-card:hover .play-overlay { opacity: 1; }

        .card-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: 'Syncopate';
            font-size: 0.9rem;
        }

        /* --- MODAL --- */
        #modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-inner { width: 90%; max-width: 1200px; position: relative; aspect-ratio: 16/9; }
        .close-btn {
            position: absolute;
            top: -60px; right: 0;
            font-size: 3rem; color: white; cursor: pointer;
        }

        .coming-soon {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #333;
            font-family: 'Syncopate';
            color: #333;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="logo">Elina</div>

    <div id="loader">
        <div class="load-text">LOADING...</div>
    </div>

    <header class="hero">
        <p>Est. 2019 — 17 Years Old</p>
        <h1>ELINA</h1>
        <p>6 Years of Development Experience</p>
    </header>

    <div class="tab-container">
        <button class="tab-btn active" onclick="scrollToSection('java')">JAVA</button>
        <button class="tab-btn" onclick="scrollToSection('skript')">SKRIPT</button>
        <button class="tab-btn" onclick="scrollToSection('python')">PYTHON</button>
        <button class="tab-btn" onclick="scrollToSection('html')">HTML</button>
    </div>

    <section id="java">
        <h2 class="section-title">JAVA PROJECTS</h2>
        <div class="video-grid">
            <div class="square-card" onclick="playVid('42O-uxmgUng')">
                <img src="https://img.youtube.com/vi/42O-uxmgUng/maxresdefault.jpg" class="thumb-img">
                <div class="play-overlay">▶</div>
                <div class="card-info">SHOWCASE 01</div>
            </div>
            <div class="square-card" onclick="playVid('HXgp96SzYrk')">
                <img src="https://img.youtube.com/vi/HXgp96SzYrk/maxresdefault.jpg" class="thumb-img">
                <div class="play-overlay">▶</div>
                <div class="card-info">SHOWCASE 02</div>
            </div>
        </div>
    </section>

    <section id="skript">
        <h2 class="section-title">SKRIPT WORK</h2>
        <div class="video-grid">
            <div class="square-card" onclick="playVid('c2LI4pcD5UQ')">
                <img src="https://img.youtube.com/vi/c2LI4pcD5UQ/maxresdefault.jpg" class="thumb-img">
                <div class="play-overlay">▶</div>
                <div class="card-info">SCRIPT REEL A</div>
            </div>
            <div class="square-card" onclick="playVid('suP98zsJ20k')">
                <img src="https://img.youtube.com/vi/suP98zsJ20k/maxresdefault.jpg" class="thumb-img">
                <div class="play-overlay">▶</div>
                <div class="card-info">SCRIPT REEL B</div>
            </div>
        </div>
    </section>

    <section id="python">
        <h2 class="section-title">PYTHON</h2>
        <div class="coming-soon">COMING SOON...</div>
    </section>

    <section id="html">
        <h2 class="section-title">HTML</h2>
        <div class="coming-soon">COMING SOON...</div>
    </section>

    <div id="modal">
        <div class="modal-inner">
            <span class="close-btn" onclick="closeVid()">&times;</span>
            <div id="videoContainer" style="width:100%; height:100%;"></div>
        </div>
    </div>

    <script>
        // --- BACKGROUND CANVAS ANIMATION ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 242, 255, 0.2)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- LOAD SCREEN ---
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
            }, 2000);
        };

        // --- SCROLL LOGIC ---
        function scrollToSection(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        // --- VIDEO PLAYER ---
        function playVid(id) {
            const modal = document.getElementById('modal');
            const container = document.getElementById('videoContainer');
            container.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            modal.style.display = 'flex';
        }

        function closeVid() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('videoContainer').innerHTML = '';
        }

        // Active Tab Highlighting
        window.onscroll = () => {
            let current = "";
            document.querySelectorAll('section').forEach(s => {
                if (pageYOffset >= s.offsetTop - 150) current = s.getAttribute('id');
            });
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                if (b.innerText.toLowerCase() === current) b.classList.add('active');
            });
        };
    </script>
</body>
</html>
