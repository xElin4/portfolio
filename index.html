<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elina | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --bg-dark: #09090b;
        }

        body {
            background-color: var(--bg-dark);
            color: #f4f4f5;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Animated Mesh Background */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 0% 0%, rgba(88, 28, 135, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
        }

        /* Glowing Cyber Grid */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(168, 85, 247, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            mask-image: radial-gradient(ellipse at center, black, transparent 80%);
        }

        /* Glass Card Effect */
        .glass-card {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-8px) scale(1.01);
        }

        .text-gradient {
            background: linear-gradient(135deg, #fff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Video Container Styling */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a855f7; }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translatey(0px); }
            50% { transform: translatey(-10px); }
            100% { transform: translatey(0px); }
        }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="mesh-bg"></div>
    <div class="grid-overlay"></div>

    <main class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-20 gap-8">
            <div class="text-center md:text-left">
                <h1 class="text-7xl font-bold tracking-tighter text-gradient mb-2">ELINA</h1>
                <p class="text-purple-400 font-medium tracking-widest uppercase text-sm">Fullstack Developer // Specialist</p>
            </div>
            
            <div class="flex gap-4">
                <div class="glass-card px-8 py-4 text-center">
                    <span class="block text-2xl font-bold">17</span>
                    <span class="text-xs text-zinc-500 uppercase tracking-widest">Age</span>
                </div>
                <div class="glass-card px-8 py-4 text-center border-purple-500/50">
                    <span class="block text-2xl font-bold text-gradient">6+</span>
                    <span class="text-xs text-zinc-500 uppercase tracking-widest">Years Exp</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            
            <section class="space-y-6">
                <div class="flex items-center gap-4">
                    <div class="h-px flex-1 bg-gradient-to-r from-transparent to-purple-500/50"></div>
                    <h2 class="text-3xl font-bold tracking-tight">JAVA</h2>
                </div>
                <div class="glass-card p-6 space-y-4">
                    <div class="video-wrapper">
                        <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/42O-uxmgUng" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <div class="video-wrapper">
                        <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/HXgp96SzYrk" frameborder="0" allowfullscreen></iframe>
                    </div>
                </div>
            </section>

            <section class="space-y-6">
                <div class="flex items-center gap-4">
                    <div class="h-px flex-1 bg-gradient-to-r from-transparent to-purple-500/50"></div>
                    <h2 class="text-3xl font-bold tracking-tight">SKRIPT</h2>
                </div>
                <div class="glass-card p-6 space-y-4">
                    <div class="video-wrapper">
                        <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/c2LI4pcD5UQ" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <div class="video-wrapper">
                        <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/suP98zsJ20k" frameborder="0" allowfullscreen></iframe>
                    </div>
                </div>
            </section>

            <section class="space-y-6">
                <div class="flex items-center gap-4">
                    <div class="h-px flex-1 bg-gradient-to-r from-transparent to-purple-500/50"></div>
                    <h2 class="text-3xl font-bold tracking-tight">PYTHON</h2>
                </div>
                <div class="glass-card p-12 text-center group">
                    <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">🐍</div>
                    <p class="text-zinc-400 font-medium italic">Coming soon...</p>
                </div>
            </section>

            <section class="space-y-6">
                <div class="flex items-center gap-4">
                    <div class="h-px flex-1 bg-gradient-to-r from-transparent to-purple-500/50"></div>
                    <h2 class="text-3xl font-bold tracking-tight">HTML</h2>
                </div>
                <div class="glass-card p-12 text-center group">
                    <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">🌐</div>
                    <p class="text-zinc-400 font-medium italic">Coming soon...</p>
                </div>
            </section>

        </div>

        <footer class="mt-24 text-center text-zinc-600 text-sm">
            <p>&copy; 2026 Elina. Built with precision.</p>
        </footer>
    </main>
</body>
</html>
