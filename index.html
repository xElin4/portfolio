<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELINA | PURPLE REIGN</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Montserrat:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #bc4cff; /* Vivid Purple */
            --bg-dark: #0a0510; /* Deep Purple Black */
            --card-glass: rgba(188, 76, 255, 0.05);
            --transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-dark); 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; /* Disable scrolling - we use sliding */
            height: 100vh;
            width: 100vw;
        }

        /* --- BACKGROUND ANIMATION --- */
        #bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #050208 100%);
            z-index: -1;
        }

        .logo {
            position: fixed;
            top: 30px;
            left: 40px;
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 5px;
            color: var(--accent);
            z-index: 1000;
            text-shadow: 0 0 15px var(--accent);
        }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed;
            inset: 0;
            background: #050208;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- NAVIGATION TABS --- */
        nav {
            position: fixed;
            top: 30px;
            right: 40px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .tab-btn {
            background: rgba(188, 76, 255, 0.1);
            border: 1px solid var(--accent);
            color: white;
            padding: 10px 20px;
            font-family: 'Syncopate';
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--accent);
            color: black;
            box-shadow: 0 0 20px var(--accent);
            transform: translateY(-3px);
        }

        /* --- SLIDING CONTAINER --- */
        .wrapper {
            display: flex;
            width: 500vw; /* 5 sections total */
            height: 100vh;
            transition: var(--transition);
        }

        section {
            width: 100vw;
            height: 100vh;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10%;
            position: relative;
        }

        /* --- HERO SECTION --- */
        .hero h1 {
            font-size: clamp(4rem, 15vw, 12rem);
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: -5px;
            filter: drop-shadow(0 0 30px rgba(188, 76, 255, 0.4));
        }

        .hero p { font-family: 'Syncopate'; color: var(--accent); letter-spacing: 5px; }

        /* --- VIDEO GRID (SQUARES) --- */
        .grid-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .square-vid {
            position: relative;
            aspect-ratio: 1/1;
            background: #150a21;
            border: 2px solid rgba(188, 76, 255, 0.2);
            overflow: hidden;
            cursor: pointer;
            transition: 0.4s;
        }

        .square-vid:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(188, 76, 255, 0.3);
            transform: scale(1.02);
        }

        .square-vid img {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 0.6; transition: 0.5s;
        }

        .square-vid:hover img { opacity: 0.3; transform: scale(1.1); }

        .play-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: var(--accent);
            opacity: 0;
            transition: 0.3s;
        }
        .square-vid:hover .play-icon { opacity: 1; }

        .vid-title {
            position: absolute;
            bottom: 20px; left: 20px;
            font-family: 'Syncopate';
            font-size: 0.8rem;
        }

        /* --- VIDEO MODAL --- */
        #modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 2, 8, 0.98);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-box { width: 80%; aspect-ratio: 16/9; position: relative; border: 1px solid var(--accent); }
        .close-x { position: absolute; top: -50px; right: 0; color: var(--accent); font-size: 2.5rem; cursor: pointer; }

        /* --- CONTENT LABELS --- */
        .section-header {
            position: absolute;
            top: 100px;
            left: 10%;
            font-family: 'Syncopate';
            font-size: 2rem;
            color: var(--accent);
            border-bottom: 4px solid var(--accent);
        }

        .coming-soon { font-family: 'Syncopate'; font-size: 3rem; opacity: 0.2; }
    </style>
</head>
<body>

    <div id="bg-overlay"></div>
    <div class="logo">ELINA</div>

    <div id="loader"><div class="spinner"></div></div>

    <nav>
        <button class="tab-btn active" onclick="slideTo(0)">MAIN</button>
        <button class="tab-btn" onclick="slideTo(1)">JAVA</button>
        <button class="tab-btn" onclick="slideTo(2)">SKRIPT</button>
        <button class="tab-btn" onclick="slideTo(3)">PYTHON</button>
        <button class="tab-btn" onclick="slideTo(4)">HTML</button>
    </nav>

    <div class="wrapper" id="mainWrapper">
        
        <section class="hero">
            <p>6 YEARS CODING // AGE 17</p>
            <h1>PURPLE</h1>
            <p>ELINA'S DEVELOPMENT HUB</p>
        </section>

        <section id="java">
            <h2 class="section-header">JAVA WORK</h2>
            <div class="grid-container">
                <div class="square-vid" onclick="openVid('42O-uxmgUng')">
                    <img src="https://img.youtube.com/vi/42O-uxmgUng/maxresdefault.jpg">
                    <div class="play-icon">▶</div>
                    <div class="vid-title">JAVA REEL 01</div>
                </div>
                <div class="square-vid" onclick="openVid('HXgp96SzYrk')">
                    <img src="https://img.youtube.com/vi/HXgp96SzYrk/maxresdefault.jpg">
                    <div class="play-icon">▶</div>
                    <div class="vid-title">JAVA REEL 02</div>
                </div>
            </div>
        </section>

        <section id="skript">
            <h2 class="section-header">SKRIPTING</h2>
            <div class="grid-container">
                <div class="square-vid" onclick="openVid('c2LI4pcD5UQ')">
                    <img src="https://img.youtube.com/vi/c2LI4pcD5UQ/maxresdefault.jpg">
                    <div class="play-icon">▶</div>
                    <div class="vid-title">SKRIPT 01</div>
                </div>
                <div class="square-vid" onclick="openVid('suP98zsJ20k')">
                    <img src="https://img.youtube.com/vi/suP98zsJ20k/maxresdefault.jpg">
                    <div class="play-icon">▶</div>
                    <div class="vid-title">SKRIPT 02</div>
                </div>
            </div>
        </section>

        <section>
            <h2 class="section-header">PYTHON</h2>
            <div class="coming-soon">COMING SOON...</div>
        </section>

        <section>
            <h2 class="section-header">HTML</h2>
            <div class="coming-soon">COMING SOON...</div>
        </section>

    </div>

    <div id="modal">
        <div class="modal-box">
            <span class="close-x" onclick="closeVid()">&times;</span>
            <div id="vidFrame" style="width:100%; height:100%;"></div>
        </div>
    </div>

    <script>
        // --- LOADING ---
        window.onload = () => {
            const loader = document.getElementById('loader');
            setTimeout(() => { loader.style.opacity = '0'; 
            setTimeout(() => loader.style.display = 'none', 1000); }, 1000);
        };

        // --- SLIDE LOGIC ---
        function slideTo(index) {
            const wrapper = document.getElementById('mainWrapper');
            const btns = document.querySelectorAll('.tab-btn');
            
            // Move wrapper
            wrapper.style.transform = `translateX(-${index * 100}vw)`;
            
            // Update Active Button
            btns.forEach(b => b.classList.remove('active'));
            btns[index].classList.add('active');
        }

        // --- VIDEO PLAYER ---
        function openVid(id) {
            const modal = document.getElementById('modal');
            const frame = document.getElementById('vidFrame');
            frame.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
            modal.style.display = 'flex';
        }

        function closeVid() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('vidFrame').innerHTML = '';
        }
    </script>
</body>
</html>
